<!DOCTYPE html>
<html>
<head>
  <title>BuildPath</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>Learn by Building</h1>
  <p>Stop watching. Start creating real projects.</p>
  <button onclick="startProject()">Start Learning</button>
</header>

<section id="projects">
  <h2>Projects</h2>
  <div class="project">
    <h3>To-Do App</h3>
    <button onclick="startProject()">Start Project</button>
  </div>
</section>

<section id="builder" style="display:none;">
  <h2>Project Builder</h2>
  <p id="step-text"></p>
  <p id="progress"></p>
  <button onclick="nextStep()">Next Step</button>
</section>

<script src="script.js"></script>

</body>
</html>
